<!doctype html>
<html lang="fr">
<meta charset="utf-8">
<title>z-radio-group — vérification</title>

<!--
	GARDE-FOU file:// — script CLASSIQUE volontairement (surtout pas `type="module"`) :
	c'est le seul qui s'exécute encore hors serveur, donc le seul capable de prévenir que
	les modules ES sont bloqués et que la page va paraître morte. Copie identique dans
	chaque page ouvrable à la main ; l'original vit dans index.html (racine).
-->
<script>
	if (location.protocol === "file:") document.write(
		'<div style="padding:1rem 1.2rem;background:#7a1d0c;color:#fff;font:15px/1.5 ui-sans-serif,system-ui,sans-serif">' +
		'<b>Ouverte en file:// — le navigateur bloque les modules ES.</b><br>' +
		'Les composants ne se définiront pas. Lance <code>node scripts/serve.mjs 5173</code> ' +
		'puis passe par <code>http://localhost:5173/</code>.</div>'
	);
</script>

<link rel="stylesheet" href="../../zoe.css">
<link rel="stylesheet" href="../../examples/page.css">
<style> .ok{color:#0a0} .ko{color:#c00;font-weight:bold} </style>
<z-radio-group id="g" value="b">
  <z-radio value="a">A</z-radio>
  <z-radio value="b">B</z-radio>
  <z-radio value="c" disabled>C</z-radio>
  <z-radio value="d">D</z-radio>
</z-radio-group>
<z-radio-group id="outer" value="x">
  <z-radio value="x">X</z-radio>
  <z-radio-group id="inner" value="1"><z-radio value="1">1</z-radio><z-radio value="2">2</z-radio></z-radio-group>
</z-radio-group>
<ul id="out"></ul>
<script type="module">
	import "../../examples/skin-switch.js";
  import "./z-radio-group.js";
  const out = document.getElementById("out");
  const t = (name, got, want) => {
    const ok = String(got) === String(want);
    out.insertAdjacentHTML("beforeend", `<li class="${ok ? "ok" : "ko"}">${ok ? "OK " : "ÉCHEC "} ${name} → ${got}${ok ? "" : " (attendu " + want + ")"}</li>`);
  };
  const g = document.getElementById("g"), r = g.radios;
  const key = (el, k) => el.dispatchEvent(new KeyboardEvent("keydown", { key: k, bubbles: true }));

  t("présélection par value", g.value, "b");
  t("un seul current", g.radios.filter(x => x.checked).length, 1);
  t("roving : un seul tabindex 0", r.filter(x => x.tabIndex === 0).length, 1);
  t("roving : c'est le choisi", r.find(x => x.tabIndex === 0).value, "b");

  r[0].click();
  t("clic → exclusivité", g.value, "a");
  t("re-clic ne dé-sélectionne pas", (r[0].click(), g.value), "a");
  g.value = "d"; t("API .value", g.value, "d");

  /* L'écouteur ne vit que le temps de CE test (sinon il re-vérifierait à chaque flèche
     plus bas, avec une attente périmée). */
  let changes = 0, seen = null;
  const spy = () => { changes++; seen = g.value; };
  g.addEventListener("change", spy);
  r[0].click();
  g.removeEventListener("change", spy);
  t("un seul change émis", changes, 1);
  t("value déjà à jour dans change", seen, "a");

  key(r[0], "ArrowDown"); t("flèche ↓ choisit la suivante", g.value, "b");
  key(r[1], "ArrowDown"); t("flèche saute la verrouillée", g.value, "d");
  key(r[3], "ArrowDown"); t("flèche boucle", g.value, "a");
  key(r[0], "ArrowUp");   t("flèche ↑ boucle à l'envers", g.value, "d");
  key(r[3], "Home");      t("Home", g.value, "a");
  key(r[0], "End");       t("End (saute la verrouillée)", g.value, "d");

  const inner = document.getElementById("inner"), outer = document.getElementById("outer");
  t("imbrication : scope des radios", outer.radios.length, 1);
  key(inner.radios[0], "ArrowDown");
  t("imbrication : le dedans bouge", inner.value, "2");
  t("imbrication : le dehors ne bouge pas", outer.value, "x");
</script>
</html>
